<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Life Hub</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        font-family: 'Segoe UI', system-ui, sans-serif; color: #e9fcf6; user-select: none;
        background: radial-gradient(circle at 20% 20%, rgba(39,233,181,.25) 0%, rgba(39,233,181,0) 40%), linear-gradient(160deg, #051824 0%, #162936 45%, #3b5265 100%);
      }
      .logo {
        width: 96px; height: 96px; border-radius: 28px; display: grid; place-items: center;
        font-size: 46px; font-weight: 900; color: #051824;
        background: linear-gradient(135deg, #27e9b5, #38bdf8 55%, #6366f1);
        box-shadow: 0 10px 40px rgba(39,233,181,.35);
        animation: breathe 2.4s ease-in-out infinite;
      }
      .error .logo { animation: none; filter: grayscale(.6); }
      @keyframes breathe { 0%,100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.07) rotate(-4deg); } }
      .dots { display: flex; gap: 6px; }
      .dots span { width: 9px; height: 9px; border-radius: 50%; background: #27e9b5; animation: jump 1s infinite; }
      .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
      .error .dots { display: none; }
      @keyframes jump { 0%,80%,100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-8px); opacity: 1; } }
      #status { font-size: 15px; opacity: .85; max-width: 520px; text-align: center; line-height: 1.4; }
      .error #status { color: #fda4af; }
      #tip { font-size: 12px; opacity: .55; max-width: 420px; text-align: center; min-height: 32px; }
      .error #tip { display: none; }
      .actions { display: none; gap: 10px; flex-wrap: wrap; justify-content: center; }
      .error .actions { display: flex; }
      button { border: 0; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; }
      .primary { background: linear-gradient(90deg, #27e9b5, #38bdf8); color: #051824; }
      .ghost { background: rgba(255,255,255,.08); color: #e9fcf6; }
      button:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div class="logo">L</div>
    <div class="dots"><span></span><span></span><span></span></div>
    <div id="status">Загрузка…</div>
    <div id="tip"></div>
    <div class="actions">
      <button class="primary" id="retry">Повторить</button>
      <button class="ghost" id="local">Использовать встроенный сервер</button>
      <button class="ghost" id="data">Папка с данными</button>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      document.getElementById('status').textContent = params.get('status') || 'Загрузка…';
      if (params.get('error')) document.body.classList.add('error');
      const tips = [
        'Совет: за ежедневные задания дают очки и XP 🔥',
        'Совет: курсы для языков можно сгенерировать ИИ по шаблону во вкладке «Языки» 🦉',
        'Совет: ачивки выдаются автоматически — просто пользуйтесь приложением 🏆',
        'Совет: F11 — полноэкранный режим, Ctrl+R — перезагрузка',
      ];
      document.getElementById('tip').textContent = tips[Math.floor(Math.random() * tips.length)];
      const bridge = window.lifehubDesktop;
      document.getElementById('retry').onclick = () => bridge && bridge.retry();
      document.getElementById('local').onclick = () => bridge && bridge.setServer(null);
      document.getElementById('data').onclick = () => bridge && bridge.openDataDir();
    </script>
  </body>
</html>
